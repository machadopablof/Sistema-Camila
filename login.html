<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — Sistema Camila</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <img src="assets/header-navy.png" alt="Dra. Camila Borges" class="app-logo" />
  </header>
  <div class="gold-bar"></div>

  <main class="login-wrap">
    <form id="login-form" class="card login-card">
      <h1 class="page-title">Área restrita</h1>
      <p class="page-subtitle">Acesso exclusivo para gerar relatórios endodônticos.</p>

      <div class="field-row">
        <label class="input-label">E-mail</label>
        <input type="email" id="email" class="input" required autocomplete="username" />
      </div>
      <div class="field-row">
        <label class="input-label">Senha</label>
        <input type="password" id="password" class="input" required autocomplete="current-password" />
      </div>

      <div id="login-error" class="form-error" hidden></div>

      <button type="submit" id="btn-login" class="btn btn-primary btn-block">Entrar</button>

      <a href="index.html" class="login-back-link">&larr; Voltar ao site</a>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
